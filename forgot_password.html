<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | AI-PDS</title>
<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif;}
body{background:#f5f7fb; color:#333; display:flex; flex-direction:column; min-height:100vh;}
nav{background:#0f172a; padding:18px 8%; display:flex; justify-content:space-between; align-items:center;}
.logo{color:white; font-size:30px; font-weight:bold;}
.login-container {flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px;}
.login-card {background: white; padding: 40px; border-radius: 18px; width: 100%; max-width: 450px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);}
.login-card h2 {color: #0f172a; font-size: 26px; margin-bottom: 10px; text-align: center;}
.login-card p {color: #64748b; text-align: center; margin-bottom: 25px; font-size: 14px;}
.form-group {margin-bottom: 18px;}
.form-group label {display: block; margin-bottom: 8px; font-weight: 600; color: #334155; font-size: 14px;}
.form-group input {width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px;}
.error-msg {background: #fef2f2; color: #dc2626; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; text-align: center;}
.success-msg {background: #f0fdf4; color: #16a34a; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; text-align: center;}
.btn-login {background: #2563eb; color: white; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;}
</style>
</head>
<body>
<nav><div class="logo">AI PDS Fraud Detection</div></nav>
<div class="login-container">
    <div class="login-card">
        <h2>Reset Password</h2>
        <p>Enter your registered account profile email and choose a new password.</p>
        {% if error %}<div class="error-msg">⚠️ {{ error }}</div>{% endif %}
        {% if success %}<div class="success-msg">✅ {{ success }}</div>{% endif %}
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="form-group"><label>Account Email</label><input type="email" name="email" required></div>
            <div class="form-group"><label>New Security Password</label><input type="password" name="password" required></div>
            <button type="submit" class="btn-login">Update Account Password &rarr;</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:14px;"><a href="{{ url_for('login') }}" style="color:#2563eb; text-decoration:none;">Back to Sign In</a></p>
    </div>
</div>

</body>
</html>
